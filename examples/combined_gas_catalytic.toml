# Default templates together: propane dehydrogenation produces H2,
# which then adsorbs on two occurrences of the vacant metal site.
[[seeds]]
smiles = "CCC"
name = "Propane"

[[seeds]]
smiles = "[*:1]"
name = "Vacant metal site"
phase = "surface"
site_atoms = {"1" = {kind = "metal", type = "M", capacity = 1}}

[generation]
max_carbon = 6
max_depth = 4

[single_event]
calculator = "mapped_event_v1"
