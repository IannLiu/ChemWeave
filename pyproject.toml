[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemweave"
version = "0.5.0"
description = "Rule-based chemical reaction network generation with RDKit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rdkit>=2024.3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
chemweave = "chemweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemweave = ["data/*.json", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
