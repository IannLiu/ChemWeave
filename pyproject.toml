[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemweave"
version = "0.3.0"
description = "Rule-based chemical reaction network generation with RDKit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rdkit>=2024.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chemweave = "chemweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemweave = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

